[package]
name = "dhakaflix-player"
version = "0.2.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
embed-resource = "3.0.12"
